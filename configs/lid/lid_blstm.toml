# Canonical TOML config for a Twin-BLSTM LID run (Algo_choice 6, Mode 7).
#
# FULL key coverage of configs/legacy/LID_BLSTM.config (its last-wins effective
# key set), generated via `speech --convert-config` and hand-checked (Phase 4c
# Task 5). Section/key names follow the declarative conversion table in
# src/rust/src/toml_config.rs (KEY_TABLE) -- the ONE config semantics: this file
# flattens to the exact same KEY -> value map the legacy .config parses to
# (pinned by `lid_blstm_toml_full_coverage` in src/rust/tests/phase4c_toml.rs).
#
# Value convention (see toml_config.rs's module doc): booleans/integers are
# native TOML; everything else (floats, comma-lists, words, paths) is a quoted
# string carrying the legacy decimal text VERBATIM -- exact fidelity for values
# like "3.795068189162301e-01" beats native-float prettiness.

[engine]
algo_choice = 6
num_outer_threads = 1
num_inner_threads = 1
results_file = "MultiConfigResults.mat"
file_type = 1
backpropagation_epochs = 0

[corpus]

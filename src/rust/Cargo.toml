[workspace]
members = [".", "speech-py"]

[package]
name = "speech"
version = "0.1.0"
edition = "2024"
description = "SAD + spoken Language Identification engine (Rust port of FastSpeechProcessing)"

[[bin]]
name = "speech"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
indexmap = { version = "2", features = ["serde"] }
nalgebra = "0.35"
ndarray = "0.16"
rayon = "1.10"
byteorder = "1.5"
bytemuck = "1"
rustfft = "6"
realfft = "3"
# Phase 7 Task 2: `fast::nn` f32 BLSTM forward -- pure-Rust SIMD matmuls
# (batched input projection) with no system BLAS.
faer = { version = "0.24", default-features = false, features = ["std"] }
symphonia = { version = "0.5", features = ["wav", "flac", "ogg", "vorbis"] }
quick-xml = { version = "0.37", features = ["serialize"] }
# Phase 7 Task 1: `bench.rs::maxrss_mb` (`getrusage(RUSAGE_SELF)`) -- a real
# [dependencies] entry, not dev-only, since `speech bench` ships in the actual
# CLI binary.
libc = "0.2"

[[bench]]
name = "kernels"
harness = false

[features]
# Test-only observation hooks (e.g. BlstmSpectralSegmenter's update-costLID
# capture for phase4a_save_update.rs), enabled for `cargo test` via the
# dev-dependency self-reference below so `cargo build`/release carry nothing.
test-support = []

[dev-dependencies]
approx = "0.5"
rstest = "0.26"
proptest = "1"
tempfile = "3"
serde_json = { version = "1", features = ["float_roundtrip"] }
speech = { path = ".", features = ["test-support"] }
# Phase 7 Task 1: `benches/kernels.rs` micro-benches over the exact kernels.
criterion = "0.8"

[profile.release]
opt-level = 3
lto = true
